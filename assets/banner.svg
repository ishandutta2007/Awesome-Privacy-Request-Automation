<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulse-element { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .float-element { animation: float 5s ease-in-out infinite; }
    .spin-element { animation: spin-slow 20s linear infinite; transform-origin: 1020px 160px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #818cf8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern overlay -->
  <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M100 0V320M200 0V320M300 0V320M400 0V320M500 0V320M600 0V320M700 0V320M800 0V320M900 0V320M1000 0V320M1100 0V320" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-element"/>
  <circle cx="1020" cy="160" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="pulse-element" style="animation-delay: 2s;"/>

  <!-- Right Decorative Icon / Graphics (Pulsing Shield & Dynamic Ring) -->
  <g class="float-element">
    <!-- Outer Ring -->
    <circle cx="1020" cy="160" r="90" fill="none" stroke="url(#accent-gradient)" stroke-width="2" stroke-dasharray="8 8" class="spin-element"/>
    <circle cx="1020" cy="160" r="70" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Shield Icon -->
    <path d="M1020 105 L1065 125 V165 C1065 195 1045 220 1020 230 C995 220 975 195 975 165 V125 L1020 105 Z" fill="#1e1b4b" stroke="url(#accent-gradient)" stroke-width="3" filter="url(#glow)"/>
    <!-- Lock inside Shield -->
    <rect x="1008" y="155" width="24" height="22" rx="4" fill="#a855f7"/>
    <path d="M1014 155 V147 C1014 142.5 1017.5 139 1020 139 C1022.5 139 1026 142.5 1026 147 V155" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1020" cy="164" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="55" width="240" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="15" y="75" class="badge-text">🛡️ PRIVACY ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="135" class="title-text" font-size="40">Awesome Privacy Request</text>
    <text x="0" y="180" class="title-text" font-size="40" fill="url(#accent-gradient)">Automation (DSAR)</text>
    
    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle-text" font-size="18">Curated SaaS Platforms, Open-Source Tools &amp; Rights Fulfillment Frameworks</text>
    
    <!-- Tags -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">GDPR</text>

      <rect x="95" y="0" width="85" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="107" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">CCPA</text>

      <rect x="190" y="0" width="115" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="202" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">DSAR Intake</text>

      <rect x="315" y="0" width="140" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="327" y="17" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Privacy Engineering</text>
    </g>
  </g>

  <!-- Bottom Animated Border Line -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent-gradient)"/>
</svg>
